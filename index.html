    { q: "Что производил Спасский завод (1857)?", o: ["Уголь", "Медь", "Соль", "Нефть"], a: 1, e: "Спасский медеплавильный завод. Уголь — Караганда." },
    { q: "Где в 1856 году купец Ушаков начал добычу угля?", o: ["В Экибастузе", "В Караганде", "В Риддере", "На Мангышлаке"], a: 1, e: "Ярмарка — Куянды. Уголь — Караганда. Медь — Спасский завод." },
    { q: "Через какие города развивалась торговля с Китаем?", o: ["Ташкент и Коканд", "Кульджа и Чугучак", "Оренбург и Троицк", "Хива и Бухара"], a: 1, e: "Через Кульджу и Чугучак скот и сырьё обменивали на китайские товары." },
    { q: "Как в Казахстан проникали капиталистические отношения?", o: ["Через земельную реформу", "Через торговлю", "Через ханские указы", "Через военные походы"], a: 1, e: "Главным путём была торговля — ярмарки, купцы, денежные расчёты." },
  ]},
  { title: "Тема 32. Трансформация традиционного общества", qs: [
    { q: "Кто относится к поэтам «Зар заман»?", o: ["Абай", "Шортанбай", "Ыбырай", "Шокан"], a: 1, e: "«Зар заман» — Шортанбай, Дулат, Мурат. Абай, Шокан, Ыбырай — просветители." },
    { q: "Как называли обедневших осевших казахов?", o: ["Тюленгуты", "Жатаки", "Төре", "Бии"], a: 1, e: "Жатаки — осевшие бедняки без скота." },

    { q: "Кто открыл школу в Тургае в 1864 году?", o: ["Шокан Уалиханов", "Абай Кунанбаев", "Ыбырай Алтынсарин", "Дулат Бабатайулы"], a: 2, e: "Ыбырай Алтынсарин — педагог, автор «Киргизской хрестоматии» (1879)." },
  ]},
];

const quiz = document.getElementById("quiz");
const scoreEl = document.getElementById("score");
const resultEl = document.getElementById("result");
const total = SECTIONS.reduce((n, s) => n + s.qs.length, 0);
let answered = 0, correct = 0;

function updateScore() {
  scoreEl.innerHTML = `Верно: ${correct} <span>/ отвечено ${answered} из ${total}</span>`;
  if (answered === total) {
    const pct = Math.round(correct / total * 100);
    resultEl.innerHTML = `<strong>${correct} из ${total}</strong>${pct}% правильных ответов`;
    resultEl.classList.add("show");
  } else {
    resultEl.classList.remove("show");
  }
}

function render() {
  quiz.innerHTML = "";
  answered = 0; correct = 0;
  let n = 0;
  SECTIONS.forEach(sec => {
    const h = document.createElement("h2"); h.textContent = sec.title; quiz.appendChild(h);
    
    sec.qs.forEach(item => {
      n++;
      const box = document.createElement("section"); box.className = "q";
      const t = document.createElement("h3");
      t.innerHTML = `<b>${n}.</b>`; t.appendChild(document.createTextNode(item.q));
      box.appendChild(t);
      const opts = document.createElement("div"); opts.className = "opts";
      const btns = item.o.map((text, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "opt"; b.textContent = text;
        b.addEventListener("click", () => {
          btns.forEach(x => x.disabled = true);
          btns[item.a].classList.add("ok");
          if (i !== item.a) b.classList.add("bad"); else correct++;
          answered++;
          box.classList.add("done");
          updateScore();
        });
        opts.appendChild(b);
        return b;
      });
      box.appendChild(opts);
      const ex = document.createElement("p"); ex.className = "expl"; ex.textContent = item.e;
      box.appendChild(ex);
      quiz.appendChild(box);
    });
  });
  updateScore();
}

document.getElementById("reset").addEventListener("click", () => { render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
render();
</script>
