<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест: темы 8–16</title>
<style>
  :root {
    --bg: #F4F6FA; --card: #FFFFFF; --ink: #1B1F3B; --text: #3D4A5C; --muted: #7A7F8C;
    --line: #D9DEE7; --opt: #EEF1F6; --opt-hover: #E2E7F0;
    --gold: #C9A227; --ok: #2E6B57; --ok-bg: #E3F2EC; --bad: #A4243B; --bad-bg: #F8E4E7;
    --head: #1B1F3B; --head-text: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12142A; --card: #1C2040; --ink: #F1F3F8; --text: #C9CFDB; --muted: #8E95A6;
      --line: #2E3458; --opt: #262B50; --opt-hover: #30365E;
      --ok: #6FC2A2; --ok-bg: #1D3B33; --bad: #F08A9B; --bad-bg: #44222B;
      --head: #0B0D1E; --head-text: #F1F3F8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.45; }
  header { background: var(--head); color: var(--head-text); padding: 32px 16px 28px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header .wrap { padding: 0; }
  h1 { font-family: Cambria, Georgia, serif; font-size: 32px; margin: 0 0 6px; line-height: 1.2; }
  header p { margin: 0; color: var(--gold); }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
  .score { font-weight: 700; color: var(--ink); }
  .score span { color: var(--muted); font-weight: 400; }
  button.reset { font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--opt); color: var(--ink); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  button.reset:hover { background: var(--opt-hover); }
  h2 { font-family: Cambria, Georgia, serif; color: var(--ink); font-size: 24px; margin: 36px 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; margin: 0 0 14px; }
  .q h3 { margin: 0 0 12px; font-size: 18px; color: var(--ink); line-height: 1.35; }
  .q h3 b { color: var(--gold); margin-right: 6px; }
  .opts { display: grid; gap: 8px; }
  .opt { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--opt); border: 2px solid transparent; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  .opt:hover:not(:disabled) { background: var(--opt-hover); }
  .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .opt.ok::after { content: "  ✓"; }
  .opt.bad::after { content: "  ✗"; }
  .expl { display: none; margin: 12px 0 0; font-size: 15px; color: var(--muted); }
  .q.done .expl { display: block; }
  .result { display: none; text-align: center; background: var(--head); color: var(--head-text); border-radius: 12px; padding: 24px 16px; margin: 30px 0 40px; }
  .result.show { display: block; }
  .result strong { display: block; font-family: Cambria, Georgia, serif; font-size: 30px; color: var(--gold); }
  footer { height: 40px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Тест по истории Казахстана</h1>
    <p>Темы 8–16: Монгольское завоевание и государства XIII–XVI вв. · Казахский народ и Казахское ханство XV–XVII вв.</p>
  </div>
</header>
<div class="bar">
  <div class="wrap">
    <div class="score" id="score">Верно: 0 <span>/ 0 отвечено из 0</span></div>
    <button class="reset" id="reset" type="button">Начать заново</button>
  </div>
</div>
<main class="wrap" id="quiz"></main>
<div class="wrap"><div class="result" id="result"></div></div>
<footer></footer>

<script>
const SECTIONS = [
  { title: "Тема 8. Монгольское завоевание. Золотая Орда, Ак Орда, Моголистан", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Кто руководил обороной Отрара?", o: ["Урус-хан", "Кайыр-хан", "Бату", "Тоглук-Тимур"], a: 1, e: "Наместник Отрара Кайыр-хан." },
    { q: "Столица Ак Орды:", o: ["Сарай-Бату", "Сыгнак", "Алмалык", "Сарайчик"], a: 1, e: "Столица Ак Орды — Сыгнак на Сырдарье." },
    { q: "Из какого улуса вырос Моголистан?", o: ["Джучи", "Угедея", "Чагатая", "Толуя"], a: 2, e: "Моголистан — восточная часть улуса Чагатая." },
    { q: "В каком году на курултае на реке Онон Темучин был провозглашён Чингисханом?", o: ["1206", "1218", "1219", "1243"], a: 0, e: "Курултай 1206 г. — образование Монгольской империи." },
    { q: "Что стало поводом к походу монголов на Хорезм?", o: ["Отказ платить дань", "Убийство монгольского каравана в Отраре", "Нападение хорезмшаха на Монголию", "Захват Жетысу Кучлуком"], a: 1, e: "В 1218 г. в Отраре по приказу хорезмшаха перебили монгольских купцов." },
    { q: "Кто основал Золотую Орду в 1243 году?", o: ["Орда-Ежен", "Узбек", "Бату", "Тохтамыш"], a: 2, e: "Внук Чингисхана Бату, столица — Сарай-Бату." },
    { q: "При каком хане Золотой Орды ислам стал государственной религией?", o: ["Бату", "Узбек", "Тохтамыш", "Мамай"], a: 1, e: "Хан Узбек (1312–1342)." },
    { q: "Кто основал Моголистан в 1348 году?", o: ["Тоглук-Тимур", "Урус-хан", "Есен-Буга", "Тимур"], a: 0, e: "Первый хан Моголистана — Тоглук-Тимур, главная знать — дулаты." },
    { q: "Какой правитель Ак Орды считается предком Керея и Жанибека?", o: ["Тохтамыш", "Урус-хан", "Абулхаир", "Едиге"], a: 1, e: "Урус-хан добился независимости Ак Орды; его потомки основали Казахское ханство." },
    { q: "Что означает термин «ярлык»?", o: ["Удел Чингизида", "Съезд знати", "Ханская грамота на управление", "Налог со скота"], a: 2, e: "Ярлык — ханская грамота на управление или привилегии." },
  ]},
  { title: "Тема 9. Походы Тимура. Ногайская Орда. Ханство Абулхаира", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Кто основал Ногайскую Орду?", o: ["Тохтамыш", "Едиге", "Абулхаир", "Урус-хан"], a: 1, e: "Эмир Едиге из рода мангытов." },
    { q: "Столица ханства Абулхаира с 1446 года:", o: ["Сарайчик", "Сыгнак", "Отрар", "Тараз"], a: 1, e: "В 1446 г. Абулхаир захватил Сыгнак и сделал его столицей." },
    { q: "По чьему приказу построен мавзолей Ходжи Ахмеда Яссауи?", o: ["Тимура", "Абулхаира", "Едиге", "Узбек-хана"], a: 0, e: "Строительство началось по приказу Тимура в конце XIV в." },
    { q: "Центр Ногайской Орды:", o: ["Сыгнак", "Сарай-Бату", "Сарайчик", "Искер"], a: 2, e: "Сарайчик на реке Жайык (Урал)." },
    { q: "Годы существования ханства Абулхаира:", o: ["1348–1462", "1428–1468", "1456–1500", "1243–1360"], a: 1, e: "Ханство кочевых узбеков — 1428–1468 гг." },
    { q: "Кто нанёс поражение Абулхаиру под Сыгнаком в 1457 году?", o: ["Ногайцы", "Ойраты", "Войска Тимура", "Моголы"], a: 1, e: "Ойраты Уз-Тимур-тайши; после этого Керей и Жанибек откочевали в Моголистан." },
    { q: "В каких сражениях Тимур разбил Тохтамыша?", o: ["На Калке и Сити", "На Кондурче и Тереке", "На Куликовом поле и Угре", "У Отрара и Сыгнака"], a: 1, e: "1391 г. — река Кондурча, 1395 г. — река Терек." },
    { q: "В каком веке путешествовали по степи Плано Карпини и Гильом Рубрук?", o: ["XI", "XIII", "XV", "XVI"], a: 1, e: "Карпини — 1245–1247, Рубрук — 1253–1255." },
  ]},
  { title: "Тема 9.1. Сибирское ханство", sub: "Вопросы из «Проверь себя» на ustudy.kz", qs: [
    { q: "Центр Сибирского ханства в конце XV века:", o: ["Баласагун", "Чимги-Тура", "Отрар", "Искер"], a: 3, e: "Сначала центром была Чимги-Тура, с конца XV в. — Искер." },
    { q: "Кто основал Сибирское ханство?", o: ["Кучум", "Ибак хан", "Едиге", "Тайбуга"], a: 1, e: "Основатель — Шибанид Ибак хан." },
    { q: "В каком году власть в ханстве перешла к Кучуму?", o: ["1456", "1563", "1581", "1598"], a: 1, e: "В 1563 году." },
    { q: "Кто во главе казаков захватил Искер в 1581–1583 годах?", o: ["Атаман Ермак", "Иван IV", "Тауекель хан", "Хакназар хан"], a: 0, e: "Казаки атамана Ермака." },
    { q: "С какими казахскими ханами Ибак заключил союз?", o: ["Касым и Хакназар", "Керей и Жанибек", "Тауекель и Есим", "Абулхаир и Аблай"], a: 1, e: "С основателями Казахского ханства — Кереем и Жанибеком." },
  ]},
  { title: "Тема 10. Формирование казахского народа", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Что первоначально означало слово «казак»?", o: ["Воин", "Свободный, вольный человек", "Кочевник", "Степняк"], a: 1, e: "Слово означало свободного человека." },
    { q: "К какой группе тюркских языков относится казахский?", o: ["Огузской", "Карлукской", "Кыпчакской", "Булгарской"], a: 2, e: "Казахский — кыпчакский язык." },
    { q: "Когда завершилось формирование казахского народа?", o: ["VI век", "X век", "XV век", "XVIII век"], a: 2, e: "Формирование народа завершилось в XV веке." },
    { q: "В каком году слово «казак» впервые упоминается в арабо-кыпчакском словаре?", o: ["1206", "1245", "1465", "1511"], a: 1, e: "Первое упоминание — словарь 1245 года." },
    { q: "Территория Младшего жуза:", o: ["Жетысу и юг", "Центр, север и восток", "Западный Казахстан", "Алтай"], a: 2, e: "Младший (Кіші) жуз — запад, Старший — Жетысу и юг, Средний — центр, север, восток." },
  ]},
  { title: "Тема 11. Образование Казахского ханства", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Кто из основателей Казахского ханства стал первым ханом?", o: ["Жанибек", "Керей", "Касым", "Бурундук"], a: 1, e: "Первым ханом был Керей (1465–1474), после него — Жанибек." },
    { q: "Хан какого государства выделил казахам земли в долинах Чу и Козыбасы?", o: ["Ак Орды", "Ногайской Орды", "Моголистана", "Сибирского ханства"], a: 2, e: "Хан Моголистана Есен-Буга." },
    { q: "Какое событие подорвало власть Абулхаира?", o: ["Орбулакская битва", "Поражение от ойратов у Сыгнака", "Поход Тимура", "Анракайская битва"], a: 1, e: "Поражение от ойратов Уз-Тимур тайши у Сыгнака (1457) подорвало власть Абулхаира." },
    { q: "Главный письменный источник об образовании Казахского ханства:", o: ["«Шежире-и тюрк» Абулгази", "«Тарих-и Рашиди» М. Х. Дулати", "«Кутадгу билиг»", "«Диван лугат ат-турк»"], a: 1, e: "«Тарих-и Рашиди» Мухаммеда Хайдара Дулати." },
  ]},
  { title: "Тема 12. Касым хан", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Как назывался свод законов Касым хана?", o: ["«Жеті жарғы»", "«Қасым ханның қасқа жолы»", "«Есім ханның ескі жолы»", "«Яса»"], a: 1, e: "«Светлый путь Касым хана»." },
    { q: "С каким государством Касым хан первым установил связи?", o: ["Османской империей", "Московским государством", "Цинской империей", "Ираном"], a: 1, e: "При Касыме начались связи с Москвой." },
    { q: "Где умер Касым хан?", o: ["В Туркестане", "В Сарайчике", "В Сыгнаке", "В Ташкенте"], a: 1, e: "Касым хан умер в Сарайчике в 1521 году." },
    { q: "Чьим сыном был Касым хан?", o: ["Керея", "Жанибека", "Бурундука", "Абулхаира"], a: 1, e: "Касым — сын Жанибека, а не Керея." },
  ]},
  { title: "Тема 13. Хакназар хан", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Какой титул носил Хакназар?", o: ["Хан трёх жузов", "Хан казахов и ногаев", "Хан Ак Орды", "Великий каган"], a: 1, e: "Он присоединил часть ногаев." },
    { q: "С каким сибирским ханом соперничал Хакназар?", o: ["Кучумом", "Едигером", "Абулхаиром", "Ермаком"], a: 0, e: "Кучум правил Сибирским ханством." },
    { q: "Кто отправил посла Третьяка Чебукова к Хакназару?", o: ["Василий III", "Иван IV", "Пётр I", "Фёдор Иванович"], a: 1, e: "Посольство 1573 года при Иване IV." },
  ]},
  { title: "Тема 14. Тауекель хан", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Кого Тауекель отправил послом в Москву в 1594 году?", o: ["Ораз-Мухаммеда", "Кул-Мухаммеда", "Третьяка Чебукова", "Тевкелева"], a: 1, e: "Посол Кул-Мухаммед." },
    { q: "Какой город Тауекель присоединил в 1598 году?", o: ["Бухару", "Ташкент", "Хиву", "Коканд"], a: 1, e: "Ташкент отошёл к казахам." },
    { q: "С какой династией воевал Тауекель?", o: ["Шейбанидами", "Тимуридами", "Цин", "Романовыми"], a: 0, e: "Главный противник — Шейбаниды Бухары, а не джунгары." },
  ]},
  { title: "Тема 15. Есим хан", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Как назывались законы Есим хана?", o: ["«Қасқа жолы»", "«Ескі жолы»", "«Жеті жарғы»", "«Яса»"], a: 1, e: "«Есім ханның ескі жолы»." },
    { q: "Какого правителя Есим разбил в 1627 году?", o: ["Имамкули", "Турсун хана", "Батур-хунтайджи", "Абдоллу II"], a: 1, e: "Турсун хан правил в Ташкенте." },
    { q: "Какой город Есим сделал столицей?", o: ["Сыгнак", "Туркестан", "Ташкент", "Сарайчик"], a: 1, e: "Столица — Туркестан; там Есим и похоронен (1628)." },
  ]},
  { title: "Тема 16. Жангир хан. Орбулакская битва", sub: "Вопросы 1–3 — из «Проверь себя» на ustudy.kz, остальные составлены по материалу темы", qs: [
    { q: "Сколько воинов было у Жангира в начале Орбулакской битвы?", o: ["600", "6 000", "20 000", "50 000"], a: 0, e: "Около 600 воинов против 50 тысяч джунгар." },
    { q: "Кто пришёл на помощь Жангиру?", o: ["Богенбай", "Жалантос", "Тауке", "Абулхаир"], a: 1, e: "Жалантос батыр, правитель Самарканда, с 20 тысячами воинов." },
    { q: "В каком году произошла Орбулакская битва?", o: ["1635", "1643", "1652", "1723"], a: 1, e: "Орбулакская битва — 1643 год." },
    { q: "Кто основал Джунгарское ханство в 1635 году?", o: ["Галдан Церен", "Батур-хунтайджи", "Уз-Тимур тайши", "Есен-Буга"], a: 1, e: "Основатель Джунгарского ханства — Батур-хунтайджи." },
  ]}
];

const quiz = document.getElementById("quiz");
const scoreEl = document.getElementById("score");
const resultEl = document.getElementById("result");
const total = SECTIONS.reduce((n, s) => n + s.qs.length, 0);
let answered = 0, correct = 0;

function updateScore() {
  scoreEl.innerHTML = `Верно: ${correct} <span>/ отвечено ${answered} из ${total}</span>`;
  if (answered === total) {
    const pct = Math.round(correct / total * 100);
    resultEl.innerHTML = `<strong>${correct} из ${total}</strong>${pct}% правильных ответов`;
    resultEl.classList.add("show");
  } else {
    resultEl.classList.remove("show");
  }
}

function render() {
  quiz.innerHTML = "";
  answered = 0; correct = 0;
  let n = 0;
  SECTIONS.forEach(sec => {
    const h = document.createElement("h2"); h.textContent = sec.title; quiz.appendChild(h);
    const p = document.createElement("p"); p.className = "sub"; p.textContent = sec.sub; quiz.appendChild(p);
    sec.qs.forEach(item => {
      n++;
      const box = document.createElement("section"); box.className = "q";
      const t = document.createElement("h3");
      t.innerHTML = `<b>${n}.</b>`; t.appendChild(document.createTextNode(item.q));
      box.appendChild(t);
      const opts = document.createElement("div"); opts.className = "opts";
      const btns = item.o.map((text, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "opt"; b.textContent = text;
        b.addEventListener("click", () => {
          btns.forEach(x => x.disabled = true);
          btns[item.a].classList.add("ok");
          if (i !== item.a) b.classList.add("bad"); else correct++;
          answered++;
          box.classList.add("done");
          updateScore();
        });
        opts.appendChild(b);
        return b;
      });
      box.appendChild(opts);
      const ex = document.createElement("p"); ex.className = "expl"; ex.textContent = item.e;
      box.appendChild(ex);
      quiz.appendChild(box);
    });
  });
  updateScore();
}

document.getElementById("reset").addEventListener("click", () => { render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
render();
</script>
</body>
</html>
