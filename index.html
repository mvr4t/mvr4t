<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест: Древний мир</title>
<style>
  :root {
    --bg: #F4F6FA; --card: #FFFFFF; --ink: #1B1F3B; --text: #3D4A5C; --muted: #7A7F8C;
    --line: #D9DEE7; --opt: #EEF1F6; --opt-hover: #E2E7F0;
    --gold: #C9A227; --ok: #2E6B57; --ok-bg: #E3F2EC; --bad: #A4243B; --bad-bg: #F8E4E7;
    --head: #1B1F3B; --head-text: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12142A; --card: #1C2040; --ink: #F1F3F8; --text: #C9CFDB; --muted: #8E95A6;
      --line: #2E3458; --opt: #262B50; --opt-hover: #30365E;
      --ok: #6FC2A2; --ok-bg: #1D3B33; --bad: #F08A9B; --bad-bg: #44222B;
      --head: #0B0D1E; --head-text: #F1F3F8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.45; }
  header { background: var(--head); color: var(--head-text); padding: 32px 16px 28px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header .wrap { padding: 0; }
  h1 { font-family: Cambria, Georgia, serif; font-size: 32px; margin: 0 0 6px; line-height: 1.2; }
  header p { margin: 0; color: var(--gold); }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
  .score { font-weight: 700; color: var(--ink); }
  .score span { color: var(--muted); font-weight: 400; }
  button.reset { font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--opt); color: var(--ink); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  button.reset:hover { background: var(--opt-hover); }
  h2 { font-family: Cambria, Georgia, serif; color: var(--ink); font-size: 24px; margin: 36px 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; margin: 0 0 14px; }
  .q h3 { margin: 0 0 12px; font-size: 18px; color: var(--ink); line-height: 1.35; }
  .q h3 b { color: var(--gold); margin-right: 6px; }
  .opts { display: grid; gap: 8px; }
  .opt { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--opt); border: 2px solid transparent; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  .opt:hover:not(:disabled) { background: var(--opt-hover); }
  .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .opt.ok::after { content: "  ✓"; }
  .opt.bad::after { content: "  ✗"; }
  .expl { display: none; margin: 12px 0 0; font-size: 15px; color: var(--muted); }
  .q.done .expl { display: block; }
  .result { display: none; text-align: center; background: var(--head); color: var(--head-text); border-radius: 12px; padding: 24px 16px; margin: 30px 0 40px; }
  .result.show { display: block; }
  .result strong { display: block; font-family: Cambria, Georgia, serif; font-size: 30px; color: var(--gold); }
  footer { height: 40px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Тест по всемирной истории</h1>
    <p>Темы 1–3: Древний Египет и Двуречье · Древний Китай и Индия · Греция, Рим, Александр Македонский, Персия</p>
  </div>
</header>
<div class="bar">
  <div class="wrap">
    <div class="score" id="score">Верно: 0 <span>/ 0 отвечено из 0</span></div>
    <button class="reset" id="reset" type="button">Начать заново</button>
  </div>
</div>
<main class="wrap" id="quiz"></main>
<div class="wrap"><div class="result" id="result"></div></div>
<footer></footer>

<script>
const SECTIONS = [
  { title: "Тема 1. Древний Египет и Древнее Двуречье", qs: [
    { q: "Какая река давала жизнь Древнему Египту?", o: ["Евфрат", "Нил", "Инд", "Тигр"], a: 1, e: "Геродот назвал Египет «даром Нила»: разливы реки оставляли плодородный ил." },
    { q: "Кто около 3100 г. до н.э. объединил Верхний и Нижний Египет?", o: ["Хеопс", "Тутмос III", "Менес", "Эхнатон"], a: 2, e: "Царь Менес объединил страну и основал столицу Мемфис." },
    { q: "В эпоху какого царства построена пирамида Хеопса?", o: ["Древнего", "Среднего", "Нового", "Позднего"], a: 0, e: "Древнее царство — «эпоха пирамид» (XXVI в. до н.э.)." },
    { q: "Кто расшифровал египетские иероглифы?", o: ["Геродот", "Г. Шлиман", "Ж.-Ф. Шампольон", "Г. Картер"], a: 2, e: "Шампольон в 1822 г. по Розеттскому камню." },
    { q: "Какой фараон пытался ввести культ одного бога Атона?", o: ["Рамсес II", "Эхнатон", "Хефрен", "Менес"], a: 1, e: "Эхнатон (XIV в. до н.э.); после его смерти реформу отменили." },
    { q: "Какой фараон прославился походами в Сирию и Палестину в XV в. до н.э.?", o: ["Тутмос III", "Джосер", "Хеопс", "Менес"], a: 0, e: "Тутмос III — великий завоеватель Нового царства." },
    { q: "С каким государством Египет заключил первый известный в мире мирный договор (1280 г. до н.э.)?", o: ["С Вавилоном", "С Ассирией", "С Персией", "С Хеттским царством"], a: 3, e: "Договор Египта (Рамсес II) и Хеттского царства — дата из списка ЕНТ." },
    { q: "Каким письмом пользовались шумеры?", o: ["Клинописью", "Иероглифами", "Алфавитом", "Узелковым письмом"], a: 0, e: "Клинопись — знаки-клинья на глиняных табличках." },
    { q: "Как называлась ступенчатая храмовая башня Двуречья?", o: ["Пирамида", "Зиккурат", "Обелиск", "Пагода"], a: 1, e: "Зиккурат — храм-башня в центре шумерского города." },
    { q: "Кто в XXIV в. до н.э. объединил Шумер и Аккад?", o: ["Хаммурапи", "Саргон Древний", "Навуходоносор II", "Ашшурбанипал"], a: 1, e: "Саргон Древний создал первую в регионе крупную державу с постоянным войском." },
    { q: "Что характерно для законов Хаммурапи?", o: ["Равенство всех перед законом", "Наказание зависело от сословия, принцип «око за око»", "Отмена рабства", "Право голоса для всех"], a: 1, e: "282 статьи; за вред свободному наказывали строже, чем за вред рабу." },
    { q: "Годы правления Хаммурапи:", o: ["1792–1750 гг. до н.э.", "605–562 гг. до н.э.", "XXIV в. до н.э.", "1280 г. до н.э."], a: 0, e: "1792–1750 гг. до н.э. — дата из списка ЕНТ." },
    { q: "Кто построил «висячие сады» Вавилона?", o: ["Хаммурапи", "Саргон", "Навуходоносор II", "Кир II"], a: 2, e: "Навуходоносор II (Нововавилонское царство), а не Хаммурапи." },
    { q: "Столица Ассирии, где находилась библиотека Ашшурбанипала:", o: ["Вавилон", "Ниневия", "Ур", "Мемфис"], a: 1, e: "В 612 г. до н.э. Ниневию разрушили Вавилон и Мидия." },
    { q: "Кто завоевал Египет в 525 г. до н.э.?", o: ["Александр Македонский", "Персидский царь Камбиз", "Ассирийцы", "Хетты"], a: 1, e: "Египет вошёл в состав Персидской державы Ахеменидов." },
  ]},
  { title: "Тема 2. Древний Китай и Древняя Индия", qs: [
    { q: "В долине какой реки возникла Хараппская цивилизация?", o: ["Ганга", "Инда", "Хуанхэ", "Янцзы"], a: 1, e: "Хараппа и Мохенджо-Даро — долина Инда, III–II тыс. до н.э." },
    { q: "Как называются священные гимны ариев?", o: ["Веды", "Сутры", "Упанишады", "Махабхарата"], a: 0, e: "Древнейшая из Вед — «Ригведа»." },
    { q: "К какой варне относились воины и цари?", o: ["Брахманы", "Кшатрии", "Вайшьи", "Шудры"], a: 1, e: "Брахманы — жрецы, кшатрии — воины, вайшьи — земледельцы и торговцы, шудры — слуги." },
    { q: "Чем каста отличается от варны?", o: ["Варн много, каст четыре", "Каста — группа по профессии внутри варны", "Касты можно было менять", "Это одно и то же"], a: 1, e: "Варн четыре, каст — множество; и варна, и каста наследственны." },
    { q: "Кто основал буддизм?", o: ["Конфуций", "Лао-цзы", "Сиддхартха Гаутама", "Ашока"], a: 2, e: "Принц Сиддхартха Гаутама стал Буддой — «просветлённым»." },
    { q: "Какой царь империи Маурья принял буддизм после завоевания Калинги?", o: ["Чандрагупта", "Ашока", "Цинь Шихуанди", "Канишка"], a: 1, e: "Ашока (III в. до н.э.) отказался от завоевательных войн." },
    { q: "Кто придумал цифры, которые мы называем «арабскими», и ноль?", o: ["Арабы", "Греки", "Индийцы", "Китайцы"], a: 2, e: "Индийцы придумали, арабы передали их в Европу." },
    { q: "На какой реке возникло царство Шан (Инь)?", o: ["Янцзы", "Хуанхэ", "Инд", "Амур"], a: 1, e: "Шан (XVI–XI вв. до н.э.) — первые китайские иероглифы." },
    { q: "Кто учил: «правитель — как отец, подданные — как послушные дети»?", o: ["Лао-цзы", "Шан Ян", "Конфуций", "Будда"], a: 2, e: "Конфуций; при Хань конфуцианство стало государственным учением." },
    { q: "Какое учение стало основой политики империи Цинь?", o: ["Конфуцианство", "Даосизм", "Легизм", "Буддизм"], a: 2, e: "Легизм — строгие законы, награды и наказания." },
    { q: "В каком году образовалось первое централизованное государство в Китае?", o: ["221 г. до н.э.", "206 г. до н.э.", "105 г.", "XVI в. до н.э."], a: 0, e: "221 г. до н.э. — империя Цинь (дата ЕНТ)." },
    { q: "Что сделал Цинь Шихуанди?", o: ["Открыл Шёлковый путь", "Ввёл единые деньги, меры и письмо", "Изобрёл бумагу", "Сделал конфуцианство государственным учением"], a: 1, e: "Также начал строить Великую стену." },
    { q: "Посольство какого китайского дипломата положило начало Великому шёлковому пути?", o: ["Сыма Цяня", "Цай Луня", "Чжан Цяня", "Чжэн Хэ"], a: 2, e: "Чжан Цянь, II в. до н.э., империя Хань." },
    { q: "Кто в 105 г. усовершенствовал изготовление бумаги?", o: ["Чжан Цянь", "Цай Лунь", "Конфуций", "Чжан Хэн"], a: 1, e: "Цай Лунь сделал бумагу дешёвой и прочной." },
    { q: "Годы империи Хань:", o: ["221–206 гг. до н.э.", "206 г. до н.э. – 220 г. н.э.", "XVI–XI вв. до н.э.", "V–III вв. до н.э."], a: 1, e: "Цинь — 221–206 гг. до н.э., затем Хань." },
  ]},
  { title: "Тема 3. Древняя Греция, Древний Рим, держава Александра Македонского, Персия", qs: [
    { q: "Что такое полис?", o: ["Храм", "Город-государство", "Провинция Персии", "Народное собрание"], a: 1, e: "Полис — город с окрестными землями, гражданами и своими законами." },
    { q: "Когда прошли первые Олимпийские игры?", o: ["776 г. до н.э.", "753 г. до н.э.", "509 г. до н.э.", "490 г. до н.э."], a: 0, e: "776 г. — Олимпиада, 753 г. — основание Рима." },
    { q: "В каком полисе существовала демократия?", o: ["В Спарте", "В Афинах", "В Македонии", "В Карфагене"], a: 1, e: "В Афинах решало народное собрание; Спарта — военный строй." },
    { q: "Кто такие илоты?", o: ["Спартанские воины", "Бесправные земледельцы Спарты", "Афинские философы", "Римские рабы-гладиаторы"], a: 1, e: "Илоты принадлежали государству и обрабатывали землю спартанцев." },
    { q: "Как называлась провинция Персидской державы?", o: ["Ном", "Полис", "Сатрапия", "Варна"], a: 2, e: "Дарий I разделил державу на сатрапии." },
    { q: "Где погиб персидский царь Кир II в 530 г. до н.э.?", o: ["При Марафоне", "В войне с массагетами", "При Гавгамелах", "В Египте"], a: 1, e: "В войне с массагетами, во главе которых была царица Томирис." },
    { q: "В какой битве 490 г. до н.э. афиняне победили персов?", o: ["При Фермопилах", "При Саламине", "При Марафоне", "При Платеях"], a: 2, e: "Марафон — победа афинян под командованием Мильтиада." },
    { q: "Кто командовал спартанцами при Фермопилах?", o: ["Перикл", "Леонид", "Фемистокл", "Мильтиад"], a: 1, e: "Царь Леонид и 300 спартанцев, 480 г. до н.э." },
    { q: "Между кем шла Пелопоннесская война (431–404 гг. до н.э.)?", o: ["Грецией и Персией", "Афинами и Спартой", "Римом и Карфагеном", "Македонией и Персией"], a: 1, e: "Победила Спарта." },
    { q: "Годы правления Александра Македонского:", o: ["336–323 гг. до н.э.", "509–27 гг. до н.э.", "431–404 гг. до н.э.", "264–146 гг. до н.э."], a: 0, e: "336–323 гг. до н.э. — дата из списка ЕНТ." },
    { q: "В какой битве Александр разгромил Дария III в 331 г. до н.э.?", o: ["При Иссе", "При Гранике", "При Гавгамелах", "При Херонее"], a: 2, e: "После Гавгамел держава Ахеменидов пала." },
    { q: "Как называется смешение греческой и восточной культур после походов Александра?", o: ["Эллинизм", "Ренессанс", "Романизация", "Демократия"], a: 0, e: "Эллинизм; центр — Александрия Египетская." },
    { q: "Годы Римской республики:", o: ["753–509 гг. до н.э.", "509–27 гг. до н.э.", "27 г. до н.э. – 476 г.", "264–146 гг. до н.э."], a: 1, e: "509–27 гг. до н.э. — дата из списка ЕНТ." },
    { q: "С кем Рим вёл Пунические войны?", o: ["С Грецией", "С Карфагеном", "С Персией", "С галлами"], a: 1, e: "264–146 гг. до н.э.; Карфаген разрушен в 146 г. до н.э." },
    { q: "Кто возглавил крупнейшее восстание рабов в Риме (74–71 гг. до н.э.)?", o: ["Ганнибал", "Спартак", "Красс", "Цезарь"], a: 1, e: "Восстание Спартака подавил Красс." },
    { q: "Кто стал первым римским императором?", o: ["Юлий Цезарь", "Октавиан Август", "Константин", "Нерон"], a: 1, e: "В 27 г. до н.э. Октавиан получил титул Август; Цезарь был диктатором." },
    { q: "Какой документ 313 года разрешил христианство в Римской империи?", o: ["Законы XII таблиц", "Миланский эдикт", "Юлианский календарь", "Кодекс Хаммурапи"], a: 1, e: "Миланский эдикт императора Константина." },
    { q: "Когда пала Западная Римская империя?", o: ["395 г.", "410 г.", "476 г.", "1453 г."], a: 2, e: "395 г. — раздел империи, 476 г. — падение Западной." },
  ]},
];

const quiz = document.getElementById("quiz");
const scoreEl = document.getElementById("score");
const resultEl = document.getElementById("result");
const total = SECTIONS.reduce((n, s) => n + s.qs.length, 0);
let answered = 0, correct = 0;

function updateScore() {
  scoreEl.innerHTML = `Верно: ${correct} <span>/ отвечено ${answered} из ${total}</span>`;
  if (answered === total) {
    const pct = Math.round(correct / total * 100);
    resultEl.innerHTML = `<strong>${correct} из ${total}</strong>${pct}% правильных ответов`;
    resultEl.classList.add("show");
  } else {
    resultEl.classList.remove("show");
  }
}

function render() {
  quiz.innerHTML = "";
  answered = 0; correct = 0;
  let n = 0;
  SECTIONS.forEach(sec => {
    const h = document.createElement("h2"); h.textContent = sec.title; quiz.appendChild(h);
    
    sec.qs.forEach(item => {
      n++;
      const box = document.createElement("section"); box.className = "q";
      const t = document.createElement("h3");
      t.innerHTML = `<b>${n}.</b>`; t.appendChild(document.createTextNode(item.q));
      box.appendChild(t);
      const opts = document.createElement("div"); opts.className = "opts";
      const btns = item.o.map((text, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "opt"; b.textContent = text;
        b.addEventListener("click", () => {
          btns.forEach(x => x.disabled = true);
          btns[item.a].classList.add("ok");
          if (i !== item.a) b.classList.add("bad"); else correct++;
          answered++;
          box.classList.add("done");
          updateScore();
        });
        opts.appendChild(b);
        return b;
      });
      box.appendChild(opts);
      const ex = document.createElement("p"); ex.className = "expl"; ex.textContent = item.e;
      box.appendChild(ex);
      quiz.appendChild(box);
    });
  });
  updateScore();
}

document.getElementById("reset").addEventListener("click", () => { render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
render();
</script>
</body>
</html>
