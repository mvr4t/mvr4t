<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Древний Казахстан — ЕНТ Тест</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a092d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #d9ade6;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .quiz-card {
            width: 100%;
            max-width: 720px;
            background-color: #2e3856;
            border: 2px solid #3b4c78;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #1a1d36;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4255ff;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #1a1d36;
            border: 2px solid #3b4c78;
            border-radius: 12px;
            padding: 14px 18px;
            color: #ffffff;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        .option-btn:hover:not(.disabled) {
            background-color: #3b4c78;
            border-color: #4255ff;
        }

        .option-btn.correct {
            background-color: #1b4d3e !important;
            border-color: #2ecc71 !important;
            color: #ffffff !important;
        }

        .option-btn.incorrect {
            background-color: #4d1b24 !important;
            border-color: #e74c3c !important;
            color: #ffffff !important;
        }

        .option-btn.disabled {
            cursor: default;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 720px;
            margin-top: 20px;
        }

        .nav-btn {
            background-color: #4255ff;
            border: none;
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: #3342cc;
        }

        .nav-btn:disabled {
            background-color: #2e3856;
            color: #6c757d;
            cursor: not-allowed;
            border: 1px solid #3b4c78;
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .counter {
            font-size: 1.05rem;
            font-weight: 600;
            color: #939bb4;
        }

        /* Экран результатов */
        .result-card {
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 6px solid #4255ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin: 10px 0;
            background: #1a1d36;
        }

        .restart-btn {
            background-color: #4255ff;
            border: none;
            color: #ffffff;
            border-radius: 12px;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: #3342cc;
        }

        @media (max-width: 600px) {
            .quiz-card {
                padding: 20px;
            }
            .question-title {
                font-size: 1.1rem;
            }
            .option-btn {
                font-size: 0.95rem;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        📝 Древний Казахстан — ЕНТ Тест
    </div>

    <!-- Основной блок теста -->
    <div class="quiz-card" id="quiz-box">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-title" id="question-text">
            Загрузка вопроса...
        </div>

        <div class="options-container" id="options-box">
            <!-- Динамические варианты -->
        </div>
    </div>

    <!-- Панель управления -->
    <div class="controls" id="controls-box">

        <div class="counter" id="counter-text">1 / 88</div>
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Вперед →</button>
    </div>

    <!-- Блок результатов -->
    <div class="quiz-card result-card" id="result-box">

        <p id="feedback-text" style="color: #939bb4; line-height: 1.5;"></p>
        <button class="restart-btn" onclick="restartQuiz()">Пройти еще раз</button>
    </div>

            { q: "Одной из главных особенностей эпохи мезолита является изобретение ...", options: ["колеса", "лука и стрел, микролитов", "гончарного круга", "железного топора", "ткацкого станка"], correct: 1 },
            { q: "Женщины в сакском обществе ...", options: ["были бесправны", "занимали высокое и почетное положение", "не допускались к войне", "были только рабынями", "управляли государством единолично"], correct: 1 },
            { q: "Период активных походов гуннов на Запада под руководством Аттилы:", options: ["VI–V вв. до н.э.", "IV–V вв. н.э.", "I–II вв. н.э.", "III–II вв. до н.э.", "VII–VIII вв. н.э."], correct: 1 },
            { q: "Походы гуннов во главе с Аттилой способствовали падению ...", options: ["Персидской державы", "Западной Римской империи", "Китайской империи Хань", "Греческих полисов", "Византии"], correct: 1 },
            { q: "Какой стиль формируется с VIII в. до н. э. в искусстве племен Казахстана?", a: "звериный стиль", options: ["полихромный стиль", "звериный стиль", "геометрический", "реализм", "абстракция"], correct: 1 },
            { q: "Иранские письменные источники называли саков ...", options: ["«азиатскими скифами»", "«турами с резвыми конями»", "«могучими воинами»", "«жителями пещер»", "«кочевниками юга»"], correct: 1 },
            { q: "Источники сообщают о героической борьбе саков за независимость в VI в. до н. э. с ...", options: ["греками", "персами", "китайцами", "римлянами", "арабами"], correct: 1 },
            { q: "Подвиг сакского пастуха, заведшего персидское войско Дария I в безводную пустыню:", options: ["Спитамен", "Ширак", "Зарина", "Скунха", "Томирис"], correct: 1 },
            { q: "Галечный камень, обработанный и заточенный с двух сторон, называется ...", options: ["чоппер", "чоппинг", "микролит", "скребок", "нуклеус"], correct: 1 },
            { q: "В раннем железном веке после саков-тиграхауда земли Жетысу были заселены племенами ...", options: ["кангюев", "усуней", "гуннов", "сарматов", "аланов"], correct: 1 },
            { q: "Автор древнекитайских «Исторических записок» («Ши цзи»), содержащих ценные сведения о гуннах:", options: ["Бан Гу", "Сыма Цянь", "Сюань Цзан", "Чжан Цянь", "Конфуций"], correct: 1 },
            { q: "Столица государства усуней:", options: ["Битянь", "Чигучен (Город Красной долины)", "Суяб", "Янгикент", "Тараз"], correct: 1 },
            { q: "Древнейший весенний праздник обновления природы, отмечаемый кочевниками более 3000 лет:", options: ["Айт", "Наурыз", "Сабантуй", "Масленица", "Курылтай"], correct: 1 },

            // Вопросы из сборника Инфоурок (6 класс / Древний Казахстан)
            { q: "По мнению ученого-антрополога О. Исмагулова, с обликом андроновцев схожи черты лица ...", options: ["каракалпаков, карачаевцев", "мангытов, ногайцев, даев", "алайцев, албанов, дулатов", "саков, сарматов, усуней", "аргынов, кыпчаков, найманов"], correct: 3 },
            { q: "Традиционный очаг земледелия на территории Казахстана в древности:", options: ["Северо-Западный Казахстан", "Западный Казахстан", "Южный Казахстан", "Северный Казахстан", "Восточный Казахстан"], correct: 2 },
            { q: "Укажите районы распространения скотоводства в древнем Казахстане:", options: ["поймы рек Амударья, Иртыш, Обь", "Приаралье, Поволжье, Приднепровье", "Прикаспийская низменность, Центральный Казахстан, горные районы", "степи от Байкала до Дуная", "только высокогорные альпийские луга"], correct: 2 },
            { q: "Эпоха открытия и использования железа для изготовления орудий труда на территории Казахстана:", options: ["конец II тыс. до н.э.", "конец I тыс. до н.э.", "VIII в. до н.э. — V в. н.э.", "I тыс. до н.э. — X в. н.э.", "V в. до н.э. — III в. н.э."], correct: 2 },
            { q: "Власть и управление в сакском обществе находились в руках ...", options: ["избираемых старейшин", "военной аристократии (вождей и воинов)", "жреческой верхушки", "земледельцев", "торговцев"], correct: 1 },
            { q: "В усуньском обществе в качестве связующего звена и предмета религиозных ритуалов выступали ...", options: ["бронзовые котлы и жертвенники", "глиняные таблички", "каменные стелы", "золотые монеты", "деревянные идолы"], correct: 0 },
            { q: "Предметы искусства ювелиров и тиснения на металле у гуннов выполнялись в ...", options: ["зверином стиле", "полихромном стиле", "античном стиле", "византийском стиле", "китайском стиле"], correct: 1 },
            { q: "Полномочия верховного правителя (шаньюя) у гуннов передавались ...", options: ["путем выборов всех общинников", "по наследству", "по решению совета жрецов", "путем захвата силой", "по согласованию с Китаем"], correct: 1 },
            { q: "Переселение первой волны гуннов на территорию Казахстана (в I в. до н.э.) связано с именем шаньюя ...", options: ["Модэ", "Чжичжи", "Аттилы", "Лаошаня", "Баламира"], correct: 1 },
            { q: "В VIII в. до н.э. — V в. н.э. в объединение племен сарматов входили племена ...", options: ["дулаты, албаны, суаны", "роксоланы, аланы, аорсы, сираки", "кипчаки, найманы, кереи", "карлуки, огузы, кимаки", "жалаиры, конраты"], correct: 1 },
            { q: "Вооружение воина и богатые элементы упряжи коня сарматского вождя были обнаружены в ...", options: ["Иссыкском кургане", "кургане Аралтобе", "Шиликтинском кургане", "Берельском могильнике", "Бесшатыре"], correct: 1 },
            { q: "Городище Костбе (в V в. до н.э. — IV в. н.э.) в Присырдарьинском регионе принадлежало племени ...", options: ["саков", "кангюев", "усуней", "гуннов", "сарматов"], correct: 1 }
        ];

        let currentIndex = 0;
        let userAnswers = new Array(questionsData.length).fill(null);

        const questionText = document.getElementById('question-text');
        const optionsBox = document.getElementById('options-box');
        const counterText = document.getElementById('counter-text');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizBox = document.getElementById('quiz-box');
        const controlsBox = document.getElementById('controls-box');
        const resultBox = document.getElementById('result-box');

        const optionLabels = ["A", "B", "C", "D", "E"];

        function loadQuestion() {
            const currentQ = questionsData[currentIndex];
            questionText.textContent = `${currentIndex + 1}. ${currentQ.q}`;
            optionsBox.innerHTML = '';

            const answered = userAnswers[currentIndex] !== null;

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                let prefix = `${optionLabels[idx]}) `;
                btn.textContent = prefix + opt;

                if (answered) {
                    btn.classList.add('disabled');
                    if (idx === currentQ.correct) {
                        btn.classList.add('correct');
                        btn.textContent += "  ✓";
                    } else if (idx === userAnswers[currentIndex]) {
                        btn.classList.add('incorrect');
                        btn.textContent += "  ✗";
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsBox.appendChild(btn);
            });

            counterText.textContent = `Вопрос ${currentIndex + 1} / ${questionsData.length}`;
            progressBar.style.width = `${((currentIndex + 1) / questionsData.length) * 100}%`;

            prevBtn.disabled = currentIndex === 0;
            if (currentIndex === questionsData.length - 1) {
                nextBtn.textContent = "Завершить";
            } else {
                nextBtn.textContent = "Вперед →";
            }
        }

        function selectOption(selectedIndex) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = selectedIndex;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function showResults() {
            quizBox.style.display = 'none';
            controlsBox.style.display = 'none';
            resultBox.style.display = 'flex';

            let correctCount = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === questionsData[idx].correct) {
                    correctCount++;
                }
            });

            const percent = Math.round((correctCount / questionsData.length) * 100);

            document.getElementById('score-percent').textContent = `${percent}%`;
            document.getElementById('score-details').textContent = `Правильно: ${correctCount} из ${questionsData.length} вопросов`;

            let feedback = "";
            if (percent >= 90) {
                feedback = "Отличный результат! Вы великолепно знаете историю Древнего Казахстана и готовы к ЕНТ на высокий балл!";
            } else if (percent >= 70) {
                feedback = "Хороший результат! Повторите темы, в которых ошиблись, и результат станет идеальным.";
            } else if (percent >= 50) {
                feedback = "Удовлетворительно. Рекомендуем еще раз перечитать параграфы по каменному веку, сакам и гуннам.";
            } else {
                feedback = "Нужно подтянуть знания! Пройдите тест еще раз и внимательно изучите правильные ответы.";
            }

            document.getElementById('feedback-text').textContent = feedback;
        }

        function restartQuiz() {
            currentIndex = 0;
            userAnswers = new Array(questionsData.length).fill(null);
            resultBox.style.display = 'none';
            quizBox.style.display = 'flex';
            controlsBox.style.display = 'flex';
            loadQuestion();
        }

        // Запуск
        loadQuestion();
    </script>
</body>
</html>
