<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квиз: темы 17–20</title>
<style>
  :root {
    --bg: #F4F6FA; --card: #FFFFFF; --ink: #1B1F3B; --text: #3D4A5C; --muted: #7A7F8C;
    --line: #D9DEE7; --opt: #EEF1F6; --opt-hover: #E2E7F0;
    --gold: #C9A227; --ok: #2E6B57; --ok-bg: #E3F2EC; --bad: #A4243B; --bad-bg: #F8E4E7;
    --head: #1B1F3B; --head-text: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12142A; --card: #1C2040; --ink: #F1F3F8; --text: #C9CFDB; --muted: #8E95A6;
      --line: #2E3458; --opt: #262B50; --opt-hover: #30365E;
      --ok: #6FC2A2; --ok-bg: #1D3B33; --bad: #F08A9B; --bad-bg: #44222B;
      --head: #0B0D1E; --head-text: #F1F3F8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.45; }
  header { background: var(--head); color: var(--head-text); padding: 32px 16px 28px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header .wrap { padding: 0; }
  h1 { font-family: Cambria, Georgia, serif; font-size: 32px; margin: 0 0 6px; line-height: 1.2; }
  header p { margin: 0; color: var(--gold); }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
  .score { font-weight: 700; color: var(--ink); }
  .score span { color: var(--muted); font-weight: 400; }
  button.reset { font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--opt); color: var(--ink); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  button.reset:hover { background: var(--opt-hover); }
  h2 { font-family: Cambria, Georgia, serif; color: var(--ink); font-size: 24px; margin: 36px 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; margin: 0 0 14px; }
  .q h3 { margin: 0 0 12px; font-size: 18px; color: var(--ink); line-height: 1.35; }
  .q h3 b { color: var(--gold); margin-right: 6px; }
  .opts { display: grid; gap: 8px; }
  .opt { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--opt); border: 2px solid transparent; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  .opt:hover:not(:disabled) { background: var(--opt-hover); }
  .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .opt.ok::after { content: "  ✓"; }
  .opt.bad::after { content: "  ✗"; }
  .expl { display: none; margin: 12px 0 0; font-size: 15px; color: var(--muted); }
  .q.done .expl { display: block; }
  .result { display: none; text-align: center; background: var(--head); color: var(--head-text); border-radius: 12px; padding: 24px 16px; margin: 30px 0 40px; }
  .result.show { display: block; }
  .result strong { display: block; font-family: Cambria, Georgia, serif; font-size: 30px; color: var(--gold); }
  footer { height: 40px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Квиз по всемирной истории</h1>
    <p>Темы 17–20: Иран и Россия · Османская империя · Китай · 1848 год, Италия и Германия</p>
  </div>
</header>
<div class="bar">
  <div class="wrap">
    <div class="score" id="score">Верно: 0 <span>/ 0 отвечено из 0</span></div>
    <button class="reset" id="reset" type="button">Начать заново</button>
  </div>
</div>
<main class="wrap" id="quiz"></main>
<div class="wrap"><div class="result" id="result"></div></div>
<footer></footer>

<script>
const SECTIONS = [
  { title: "Тема 17. Иран в XIX веке: англо-русское соперничество", sub: "Вопросы по карточкам Quizlet", qs: [
    { q: "В каком году Персия официально стала называться Ираном?", o: ["1907", "1925", "1935", "1945"], a: 2, e: "В 1935 г. при Реза-шахе Пехлеви страна официально переименована в Иран." },
    { q: "С какой целью в 1807 г. в Тегеран прибыла французская миссия генерала Гардана?", o: ["Помочь шаху подавить восстание бабидов", "Подстрекать шаха против России и Англии", "Получить табачную концессию", "Договориться о разделе Ирана с Англией"], a: 1, e: "Наполеон хотел направить Иран против России и Англии и открыть путь к Индии." },
    { q: "Годы первой русско-иранской войны:", o: ["1804–1813", "1826–1828", "1853–1856", "1856–1857"], a: 0, e: "Первая русско-иранская война шла в 1804–1813 гг." },
    { q: "Чем закончилась русско-иранская война 1804–1813 гг.?", o: ["Победой Ирана и возвратом Грузии", "Разделом Ирана на сферы влияния", "Победой России — Гюлистанский мир", "Вмешательством Англии и нейтрализацией Каспия"], a: 2, e: "По Гюлистанскому миру 1813 г. Иран признал за Россией Дагестан, Грузию и ханства Северного Азербайджана." },
    { q: "Каковы итоги Туркманчайского мирного договора 1828 г.?", o: ["Иран отказался от Герата", "Граница по реке Аракс, Восточная Армения — России, контрибуция 20 млн рублей", "Иран разделён на три зоны влияния", "Англия получила право держать флот на Каспии"], a: 1, e: "Туркманчай: граница по Араксу, Эриванское и Нахичеванское ханства — России, 20 млн рублей контрибуции." },
    { q: "Какая часть Ирана стала сферой влияния России по соглашению 1907 г.?", o: ["Юго-восточная", "Центральная", "Северная", "Побережье Персидского залива"], a: 2, e: "Север — Россия, центр — нейтральная зона, юго-восток — Англия." },
    { q: "Как переводится название учебного заведения Дар уль-Фунун (1851)?", o: ["«Дом справедливости»", "«Дом наук»", "«Новый порядок»", "«Дом мудрости»"], a: 1, e: "Дар уль-Фунун — «Дом наук», основан по инициативе Амир Кабира." },
    { q: "Что стало главным итогом Иранской революции в 1906 г.?", o: ["Свержение династии Каджаров", "Конституционная реформа: созыв меджлиса и принятие конституции", "Отмена всех иностранных концессий", "Изгнание русских и английских войск"], a: 1, e: "В 1906 г. созван первый меджлис и принят Основной закон — Иран стал конституционной монархией." },
  ]},
  { title: "Тема 18. Османская империя и Танзимат", sub: "Вопросы раздела «Проверь себя», ustudy.kz", qs: [
    { q: "Каким документом начались реформы Танзимат?", o: ["Гюльханейским хатт-и шерифом", "Конституцией Мидхат-паши", "Кючук-Кайнарджийским договором", "Хатт-и хумаюном"], a: 0, e: "Хатт-и шериф 1839 г. гарантировал подданным безопасность жизни, чести и имущества." },
    { q: "Какой султан ликвидировал корпус янычар в 1826 году?", o: ["Селим III", "Абдул-Хамид II", "Махмуд II", "Сулейман I"], a: 2, e: "Махмуд II уничтожил янычар и создал новую армию." },
    { q: "Что из перечисленного стало результатом Танзимата?", o: ["Полная независимость от европейских займов", "Создание светских школ и новых кодексов законов", "Возвращение Крыма", "Отмена султаната"], a: 1, e: "Танзимат модернизировал образование и право, но не избавил империю от долгов." },
    { q: "Кто был автором первой османской конституции 1876 года?", o: ["Мустафа Кемаль", "Мухаммед Али", "Энвер-паша", "Мидхат-паша"], a: 3, e: "Великий визирь Мидхат-паша добился конституции, но Абдул-Хамид II вскоре её приостановил." },
    { q: "Какое событие показывает ослабление Османской империи во второй половине XVIII века?", o: ["Взятие Константинополя", "Кючук-Кайнарджийский мир с Россией", "Битва при Мохаче", "Создание миллетов"], a: 1, e: "Мир 1774 г. закрепил поражение Турции и потерю контроля над Крымом." },
  ]},
  { title: "Тема 19. Китай и европейские державы в XIX веке", sub: "Вопросы раздела «Проверь себя», ustudy.kz", qs: [
    { q: "Какой товар стал главной причиной первой войны Англии против Китая в 1840 году?", o: ["Чай", "Шёлк", "Опиум", "Фарфор"], a: 2, e: "Китай запретил ввоз опиума, и Англия начала первую опиумную войну." },
    { q: "По Нанкинскому договору 1842 года Великобритания получила:", o: ["Порт-Артур", "Гонконг", "Тайвань", "Циндао"], a: 1, e: "Гонконг перешёл Англии, и были открыты пять портов." },
    { q: "Государство, провозгласившее в 1899 году доктрину «открытых дверей» в Китае:", o: ["Германия", "Япония", "Франция", "США"], a: 3, e: "Госсекретарь США Дж. Хэй потребовал равных торговых прав для всех держав." },
    { q: "Под каким лозунгом действовали ихэтуани?", o: ["«Поддержим Цин, уничтожим иностранцев!»", "«Земля — тем, кто её обрабатывает!»", "«Свергнем маньчжуров, восстановим Мин!»", "«Демократия и наука!»"], a: 0, e: "Ихэтуани боролись против иностранцев и поддерживали династию Цин." },
    { q: "Какое понятие означает торговое поселение европейцев в чужой стране?", o: ["Миссия", "Метрополия", "Протекторат", "Фактория"], a: 3, e: "Фактории — укреплённые торговые склады-поселения, как в Кантоне." },
  ]},
  { title: "Тема 20. Революции 1848 г. Объединение Италии и Германии", sub: "Вопросы раздела «Проверь себя», ustudy.kz", qs: [
    { q: "Кто возглавил поход «Тысячи» в 1860 году?", o: ["Дж. Мадзини", "К. Кавур", "Дж. Гарибальди", "Виктор Эммануил II"], a: 2, e: "Гарибальди с добровольцами освободил Сицилию и Неаполь." },
    { q: "Где была провозглашена Германская империя в 1871 году?", o: ["В Берлине", "Во Франкфурте", "В Вене", "В Версале"], a: 3, e: "Вильгельма I провозгласили императором в Зеркальном зале Версаля." },
    { q: "Какое произведение К. Маркса и Ф. Энгельса вышло в 1848 году?", o: ["«Манифест Коммунистической партии»", "«Капитал»", "«Общественный договор»", "«Что делать?»"], a: 0, e: "В «Манифесте» изложена идея классовой борьбы и пролетарской революции." },
    { q: "Какую территорию Франция потеряла по итогам франко-прусской войны?", o: ["Савойю и Ниццу", "Эльзас и часть Лотарингии", "Корсику", "Бургундию"], a: 1, e: "По Франкфуртскому миру 1871 г. Эльзас и часть Лотарингии отошли Германии." },
    { q: "Какое государство стало ядром объединения Италии?", o: ["Папская область", "Королевство Обеих Сицилий", "Ломбардия", "Сардинское королевство (Пьемонт)"], a: 3, e: "Объединение шло вокруг Сардинского королевства и династии Виктора Эммануила II." },
  ]},
];

const quiz = document.getElementById("quiz");
const scoreEl = document.getElementById("score");
const resultEl = document.getElementById("result");
const total = SECTIONS.reduce((n, s) => n + s.qs.length, 0);
let answered = 0, correct = 0;

function updateScore() {
  scoreEl.innerHTML = `Верно: ${correct} <span>/ отвечено ${answered} из ${total}</span>`;
  if (answered === total) {
    const pct = Math.round(correct / total * 100);
    resultEl.innerHTML = `<strong>${correct} из ${total}</strong>${pct}% правильных ответов`;
    resultEl.classList.add("show");
  } else {
    resultEl.classList.remove("show");
  }
}

function render() {
  quiz.innerHTML = "";
  answered = 0; correct = 0;
  let n = 0;
  SECTIONS.forEach(sec => {
    const h = document.createElement("h2"); h.textContent = sec.title; quiz.appendChild(h);
    const p = document.createElement("p"); p.className = "sub"; p.textContent = sec.sub; quiz.appendChild(p);
    sec.qs.forEach(item => {
      n++;
      const box = document.createElement("section"); box.className = "q";
      const t = document.createElement("h3");
      t.innerHTML = `<b>${n}.</b>`; t.appendChild(document.createTextNode(item.q));
      box.appendChild(t);
      const opts = document.createElement("div"); opts.className = "opts";
      const btns = item.o.map((text, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "opt"; b.textContent = text;
        b.addEventListener("click", () => {
          btns.forEach(x => x.disabled = true);
          btns[item.a].classList.add("ok");
          if (i !== item.a) b.classList.add("bad"); else correct++;
          answered++;
          box.classList.add("done");
          updateScore();
        });
        opts.appendChild(b);
        return b;
      });
      box.appendChild(opts);
      const ex = document.createElement("p"); ex.className = "expl"; ex.textContent = item.e;
      box.appendChild(ex);
      quiz.appendChild(box);
    });
  });
  updateScore();
}

document.getElementById("reset").addEventListener("click", () => { render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
render();
</script>
</body>
</html>
